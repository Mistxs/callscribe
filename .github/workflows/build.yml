name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build release
        run: ./scripts/build-app.sh

      - name: Verify app bundle
        run: |
          test -x "dist/CallScribe.app/Contents/MacOS/CallScribe"
          codesign --verify --verbose "dist/CallScribe.app"
          plutil -lint "dist/CallScribe.app/Contents/Info.plist"

      - name: Package app
        run: ditto -c -k --keepParent "dist/CallScribe.app" "CallScribe.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: CallScribe
          path: CallScribe.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release
        run: APP_VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh

      - name: Zip
        run: ditto -c -k --keepParent "dist/CallScribe.app" "CallScribe.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: CallScribe.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallScribe-release
          path: CallScribe.zip
